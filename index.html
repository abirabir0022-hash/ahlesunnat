
<!DOCTYPE html>
<html lang="bn">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- ==============================
         PWA SETTINGS
         ============================== -->

    <!-- মোবাইলের browser/app theme color -->
    <meta name="theme-color" content="#00796b">

    <!-- PWA manifest -->
    <link rel="manifest" href="./manifest.json">

    <title>আহলে সুন্নাত ওয়াল জামাত</title>


    <style>

        /* ==============================
           LIGHT THEME
           ============================== */

        :root {

            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --heading-color: #00796b;
            --input-bg: #ffffff;
            --input-border: #ccc;
            --result-bg: #e0f2f1;
            --btn-bg: #00796b;
            --btn-hover: #004d40;
            --history-bg: #f9f9f9;

        }


        /* ==============================
           DARK THEME
           ============================== */

        [data-theme="dark"] {

            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --heading-color: #80cbc4;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --result-bg: #263238;
            --btn-bg: #00897b;
            --btn-hover: #00695c;
            --history-bg: #2a2a2a;

        }


        body {

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background: var(--bg-color);

            color: var(--text-color);

            margin: 0;

            padding: 20px;

            transition:
                background 0.3s ease,
                color 0.3s ease;

        }


        .container {

            max-width: 600px;

            margin: auto;

            background: var(--container-bg);

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.1);

        }


        .header-flex {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        h2 {

            color: var(--heading-color);

            margin: 0;

        }


        .theme-toggle {

            background: none;

            border:
                2px solid var(--heading-color);

            color: var(--heading-color);

            padding: 6px 12px;

            border-radius: 20px;

            cursor: pointer;

            font-size: 14px;

            font-weight: bold;

        }


        input[type="text"] {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            background: var(--input-bg);

            color: var(--text-color);

            border:
                1px solid var(--input-border);

            border-radius: 8px;

            box-sizing: border-box;

            font-size: 16px;

            outline: none;

        }


        input[type="text"]:focus {

            border-color: var(--heading-color);

        }


        button.submit-btn {

            width: 100%;

            background: var(--btn-bg);

            color: white;

            border: none;

            padding: 14px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

        }


        button.submit-btn:hover {

            background: var(--btn-hover);

        }


        .result-box {

            margin-top: 20px;

            padding: 18px;

            background: var(--result-bg);

            border-left:
                5px solid var(--heading-color);

            border-radius: 8px;

            min-height: 60px;

            white-space: pre-wrap;

            word-break: break-word;

            line-height: 1.6;

        }


        .action-btns {

            display: flex;

            gap: 10px;

            margin-top: 10px;

        }


        .action-btn {

            background: var(--heading-color);

            color: white;

            border: none;

            padding: 8px 12px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 14px;

            flex: 1;

        }


        .history-section {

            margin-top: 30px;

            border-top:
                1px solid var(--input-border);

            padding-top: 15px;

        }


        .history-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 10px;

        }


        .clear-history {

            background: #d32f2f;

            color: white;

            border: none;

            padding: 4px 10px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 12px;

        }


        .history-item {

            background: var(--history-bg);

            padding: 10px;

            margin-bottom: 8px;

            border-radius: 6px;

            border:
                1px solid var(--input-border);

            font-size: 14px;

        }


        .history-q {

            font-weight: bold;

            color: var(--heading-color);

        }


        .developer-credit {

            margin-top: 25px;

            text-align: center;

            font-size: 13px;

            color: var(--heading-color);

            border-top:
                1px dashed var(--input-border);

            padding-top: 12px;

            opacity: 0.9;

        }


        .loader-container {

            display: flex;

            align-items: center;

            gap: 10px;

            color: var(--heading-color);

            font-weight: bold;

        }


        .spinner {

            width: 20px;

            height: 20px;

            border:
                3px solid rgba(0, 121, 107, 0.2);

            border-top:
                3px solid var(--heading-color);

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

        }


        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>

<div class="container">


    <!-- ==============================
         HEADER
         ============================== -->

    <div class="header-flex">

        <h2>
            ইসলামিক প্রশ্নোত্তর
        </h2>

        <button
            class="theme-toggle"
            onclick="toggleTheme()">

            🌙 থিম

        </button>

    </div>


    <!-- ==============================
         QUESTION INPUT
         ============================== -->

    <input
        type="text"
        id="userQuery"
        placeholder="আপনার প্রশ্ন এখানে লিখুন..."
    >


    <button
        class="submit-btn"
        onclick="loadAnswer()">

        উত্তর খুঁজুন

    </button>


    <!-- AI ANSWER -->
    <div
        class="result-box"
        id="outputDiv">

        উত্তর এখানে প্রদর্শিত হবে...

    </div>


    <!-- COPY + SHARE -->
    <div
        class="action-btns"
        id="actionBtns"
        style="display: none;">

        <button
            class="action-btn"
            onclick="copyAnswer()">

            📋 কপি করুন

        </button>


        <button
            class="action-btn"
            onclick="shareAnswer()">

            🔗 শেয়ার করুন

        </button>

    </div>


    <!-- ==============================
         HISTORY
         ============================== -->

    <div class="history-section">

        <div class="history-header">

            <strong>
                পূর্ববর্তী প্রশ্নসমূহ (হিস্টরি)
            </strong>

            <button
                class="clear-history"
                onclick="clearHistory()">

                সব মুছুন

            </button>

        </div>


        <div id="historyList">

            কোনো হিস্টরি নেই।

        </div>

    </div>


    <!-- DEVELOPER -->
    <div class="developer-credit">

        প্রস্তুতকারক ও ডেভেলপার:

        <strong>
            Mohammad Moddassir Ali
        </strong>

        <br>

        যোগাযোগ: 01307779842

    </div>


</div>



<script type="module">

    /* ==========================================
       FIREBASE IMPORT
       ==========================================

       Firebase SDK CDN থেকে Firebase App
       এবং Cloud Messaging নেওয়া হচ্ছে।

       কাজ:
       🔥 Firebase-এর সাথে website connect করা
       🔔 Push Notification চালু করা
    ========================================== */

    import {
        initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {
        getMessaging,
        getToken,
        onMessage
    } from
    "https://www.gstatic.com/firebasejs/12.17.1/firebase-messaging.js";



    /* ==========================================
       FIREBASE CONFIG
       ========================================== */

    const firebaseConfig = {

        apiKey:
            "AIzaSyCPRWpUI98Ggr4rrlC5yqXsaaAJIkCNp-0",

        authDomain:
            "ahle-sunnat-islamic-qa.firebaseapp.com",

        projectId:
            "ahle-sunnat-islamic-qa",

        storageBucket:
            "ahle-sunnat-islamic-qa.firebasestorage.app",

        messagingSenderId:
            "58263470817",

        appId:
            "1:58263470817:web:31e14a98ebbd00f9c26da0",

        measurementId:
            "G-VYT6MJYZW7"

    };


    /* Firebase চালু */
    const app =
        initializeApp(firebaseConfig);


    /* Firebase Cloud Messaging চালু */
    const messaging =
        getMessaging(app);



    /* ==========================================
       VAPID PUBLIC KEY
       ==========================================

       Firebase Console থেকে পাওয়া
       Web Push certificate public key।

       এটি public key।
    ========================================== */

    const vapidKey =
        "BKQ614I1ySh5mec9TTsSfNoZ_NRbxv_jTQzxJ5dSQR5PkbzJmkR-T-8HaqkjoM2Dqrd20KISgVdJES0qwwiBWgs";



    /* ==========================================
       REQUEST NOTIFICATION PERMISSION
       ========================================== */

    async function enableNotifications() {

        try {

            /* Browser-এর notification permission চাই */
            const permission =
                await Notification.requestPermission();


            if (permission !== "granted") {

                console.log(
                    "Notification permission denied."
                );

                return;

            }


            /*
             Firebase Messaging service worker
             register করা হচ্ছে।
            */

            const registration =
                await navigator.serviceWorker.register(
                    "./firebase-messaging-sw.js"
                );


            /*
             Firebase থেকে notification token নেওয়া।
             
             এই token-এর মাধ্যমে নির্দিষ্ট device-এ
             notification পাঠানো যায়।
            */

            const token =
                await getToken(
                    messaging,
                    {
                        vapidKey: vapidKey,
                        serviceWorkerRegistration:
                            registration
                    }
                );


            if (token) {

                console.log(
                    "Firebase Notification Token:",
                    token
                );

                /*
                 IMPORTANT:
                 এই token পরে n8n / database-এ
                 save করা যাবে।
                */

                localStorage.setItem(
                    "fcm_token",
                    token
                );


                alert(
                    "🔔 Notification চালু হয়েছে!"
                );

            } else {

                console.log(
                    "Notification token পাওয়া যায়নি।"
                );

            }


        } catch (error) {

            console.error(
                "Notification setup error:",
                error
            );

        }

    }



    /* ==========================================
       FOREGROUND NOTIFICATION
       ==========================================

       Website খোলা থাকা অবস্থায় Firebase
       notification এলে এখানে ধরা হবে।
    ========================================== */

    onMessage(
        messaging,
        (payload) => {

            console.log(
                "Foreground notification:",
                payload
            );


            const title =
                payload.notification?.title ||
                "আহলে সুন্নাত";


            const body =
                payload.notification?.body ||
                "নতুন notification এসেছে।";


            /*
             Browser notification দেখানো।
            */

            if (
                Notification.permission ===
                "granted"
            ) {

                new Notification(
                    title,
                    {
                        body: body,
                        icon: "./icon-192.png"
                    }
                );

            }

        }
    );



    /* ==========================================
       AUTO NOTIFICATION SETUP
       ==========================================

       Website load হওয়ার পর notification
       permission চাইবে।

       যদি আগে permission দেওয়া থাকে,
       আবার permission popup দেখাবে না।
    ========================================== */

    window.addEventListener(
        "load",
        () => {

            if (
                "Notification" in window &&
                Notification.permission !==
                "granted"
            ) {

                /*
                 একটু delay রাখা হয়েছে যাতে
                 website প্রথমে properly load হয়।
                */

                setTimeout(
                    enableNotifications,
                    1500
                );

            }

        }
    );



    /* ==========================================
       THEME
       ========================================== */

    window.toggleTheme =
    function () {

        const html =
            document.documentElement;


        const currentTheme =
            html.getAttribute(
                "data-theme"
            );


        if (
            currentTheme === "dark"
        ) {

            html.setAttribute(
                "data-theme",
                "light"
            );


            localStorage.setItem(
                "theme",
                "light"
            );

        }

        else {

            html.setAttribute(
                "data-theme",
                "dark"
            );


            localStorage.setItem(
                "theme",
                "dark"
            );

        }

    };


    /* আগের theme restore */
    const savedTheme =
        localStorage.getItem(
            "theme"
        ) || "light";


    document.documentElement
        .setAttribute(
            "data-theme",
            savedTheme
        );



    /* ==========================================
       AI ANSWER
       ========================================== */

    let currentAnswerText = "";


    window.loadAnswer =
    async function () {

        const q =
            document
                .getElementById(
                    "userQuery"
                )
                .value
                .trim();


        const box =
            document.getElementById(
                "outputDiv"
            );


        const actionBtns =
            document.getElementById(
                "actionBtns"
            );


        if (!q) {

            alert(
                "আগে প্রশ্ন লিখুন!"
            );

            return;

        }


        actionBtns.style.display =
            "none";


        box.innerHTML = `

            <div class="loader-container">

                <div class="spinner"></div>

                <span>
                    উত্তর খোঁজা হচ্ছে,
                    দয়া করে অপেক্ষা করুন...
                </span>

            </div>

        `;


        try {

            const res =
                await fetch(
                    "https://server.automationlearners.com/webhook/7b915938-8622-40de-9419-86bfe51abc25",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({
                                question: q
                            })

                    }
                );


            const responseText =
                await res.text();


            let jsonRes;


            try {

                jsonRes =
                    JSON.parse(
                        responseText
                    );

            }

            catch (e) {

                jsonRes = {
                    answer:
                        responseText
                };

            }


            if (
                jsonRes &&
                jsonRes.answer
            ) {

                currentAnswerText =
                    jsonRes.answer;

            }

            else if (
                jsonRes &&
                jsonRes.output
            ) {

                currentAnswerText =
                    jsonRes.output;

            }

            else {

                currentAnswerText =
                    responseText ||
                    "কোনো উত্তর পাওয়া যায়নি।";

            }


            box.innerText =
                currentAnswerText;


            actionBtns.style.display =
                "flex";


            saveToHistory(
                q,
                currentAnswerText
            );


        }

        catch (err) {

            console.error(err);


            box.innerText =
                "সংযোগ স্থাপন করা যায়নি। " +
                "ইন্টারনেটে সমস্যা হতে পারে.";


            actionBtns.style.display =
                "none";

        }

    };



    /* ==========================================
       COPY
       ========================================== */

    window.copyAnswer =
    function () {

        if (!currentAnswerText)
            return;


        navigator.clipboard
            .writeText(
                currentAnswerText
            )
            .then(() => {

                alert(
                    "উত্তরটি ক্লিপবোর্ডে " +
                    "কপি করা হয়েছে!"
                );

            });

    };



    /* ==========================================
       SHARE
       ========================================== */

    window.shareAnswer =
    function () {

        if (!currentAnswerText)
            return;


        if (
            navigator.share
        ) {

            navigator.share({

                title:
                    "ইসলামিক প্রশ্নোত্তর",

                text:
                    currentAnswerText

            }).catch(
                (error) =>
                    console.log(
                        "Sharing failed",
                        error
                    )
            );

        }

        else {

            alert(
                "আপনার ডিভাইসটি শেয়ারিং " +
                "সমর্থন করছে না।"
            );

        }

    };



    /* ==========================================
       HISTORY
       ========================================== */

    function saveToHistory(
        question,
        answer
    ) {

        let history =
            JSON.parse(
                localStorage.getItem(
                    "islamic_qa_history"
                )
            ) || [];


        history.unshift({

            question:
                question,

            answer:
                answer

        });


        if (
            history.length > 10
        ) {

            history.pop();

        }


        localStorage.setItem(

            "islamic_qa_history",

            JSON.stringify(history)

        );


        displayHistory();

    }



    function displayHistory() {

        let history =
            JSON.parse(
                localStorage.getItem(
                    "islamic_qa_history"
                )
            ) || [];


        const historyListDiv =
            document.getElementById(
                "historyList"
            );


        if (
            history.length === 0
        ) {

            historyListDiv.innerHTML =
                "কোনো হিস্টরি নেই।";

            return;

        }


        let html = "";


        history.forEach(
            (item) => {

                html += `

                    <div class="history-item">

                        <div class="history-q">

                            প্রশ্ন:
                            ${escapeHtml(
                                item.question
                            )}

                        </div>

                        <div
                            style="
                                margin-top: 5px;
                                color:
                                var(--text-color);
                            "
                        >

                            ${escapeHtml(
                                item.answer
                                    .substring(
                                        0,
                                        80
                                    )
                            )}...

                        </div>

                    </div>

                `;

            }
        );


        historyListDiv.innerHTML =
            html;

    }



    /* নিরাপদভাবে history দেখানো */
    function escapeHtml(text) {

        const div =
            document.createElement(
                "div"
            );

        div.textContent =
            text;

        return div.innerHTML;

    }



    window.clearHistory =
    function () {

        localStorage.removeItem(
            "islamic_qa_history"
        );

        displayHistory();

    };



    /* ==========================================
       PAGE LOAD
       ========================================== */

    window.addEventListener(
        "load",
        () => {

            displayHistory();

        }
    );



    /* ==========================================
       PWA SERVICE WORKER
       ==========================================

       sw.js = তোমার PWA/offline cache

       firebase-messaging-sw.js =
       Firebase Push Notification

       দুটো আলাদা কাজ।
    ========================================== */

    if (
        "serviceWorker" in navigator
    ) {

        window.addEventListener(
            "load",
            async () => {

                try {

                    const registration =
                        await navigator
                            .serviceWorker
                            .register(
                                "./sw.js"
                            );


                    console.log(
                        "PWA Service Worker registered:",
                        registration.scope
                    );

                }

                catch (error) {

                    console.error(
                        "PWA Service Worker failed:",
                        error
                    );

                }

            }
        );

    }

</script>

</body>
</html>
